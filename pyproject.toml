[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-alert-triage"
dynamic = ["version"]
description = "AI triage for security alerts, measured on labelled data and red-teamed with prompt injection"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Ahmed Dahdouh"}]
dependencies = []

[project.scripts]
triage = "triage.cli:main"

[tool.setuptools]
packages = ["triage"]

[tool.setuptools.dynamic]
version = {attr = "triage.__version__"}

[tool.pytest.ini_options]
testpaths = ["tests"]
